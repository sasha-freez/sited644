<!DOCTYPE html>
<html>
<head>
	<title>cuSel - плагин изменения select | pcvector.net</title>
	<meta http-equiv="Content-Type" content="text/html; charset=windows-1251" />
	<meta http-equiv="Cache-Control" content="no-cache" />

	<link rel="stylesheet" href="/css/proximanova/stylesheet.css" type="text/css" media="all" />
	<link rel="stylesheet" href="/css/master.css" type="text/css" media="all" />
	<link rel="stylesheet" href="/css/media.css" type="text/css" media="all" />
	
	<script type="text/javascript" src="/js/jquery-1.8.0.min.js"></script>
	
	<script src="/cusel/js/cusel.js" type="text/javascript"></script>
	<script type="text/javascript">
	$(function(){
		var cusize = {
            changedEl: "#cusize",
            visRows: 10,
			scrollArrows: false
        }
		cuSel(cusize);
		
		var cucolor = {
            changedEl: "#cucolor",
            visRows: 10,
			scrollArrows: false
        }
		cuSel(cucolor);
	});
	</script>

</head>
<body style="padding:100px 0 0 100px;">
<div class="goods-details">
<div class="goods-desc">

<form method="post" class="form-horizontal ms2_form">
<input type="hidden" value="24" name="id">
<input type="hidden" value="1" id="product_price" name="count">
<div class="goods-price">
	
		2 900 Р
	
</div>
<div class="goods-select">
	<button value="cart/add" name="ms2_action" class="btn-h36 in_car" type="submit"><span>В корзину</span></button>
	
	<div class="select sel-size"">
		<label>РАЗМЕР:</label>
		<select class="form-control" name="options[size]" id="cusize"><option value="XS">XS</option>
<option value="S">S</option>
<option value="M">M</option>
<option value="L">L</option>
<option value="XL">XL</option>
<option value="XXL">XXL</option></select>
	</div>
	<div id="sel-color" class="select sel-color">
		<label>ЦВЕТ:</label>
		<select class="form-control" name="options[color]" id="cucolor"><option value="Темно-cиний" class="dark-blue">Темно-cиний</option>
<option value="Черный" class="black" data-class="black">Черный</option>
<option value="Серый" class="gray" data-class="gray">Серый</option></select>
	</div>
</div>
<div class="spoiler">
	<div class="stitle">Подобрать размер</div>
	<div class="stxt">
		<p>чтобы подобрать размер нужно....</p>
	</div>
</div>
</form>

</div></div>

</body>
</html>
