<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>MediaElement.js 3.0 - Multiple Plugins (1)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <link rel="icon" href="favicon.ico" type="image/x-icon">


    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/mediaelement/4.2.6/mediaelementplayer.css">
    <link rel="stylesheet" href="demo.css">
</head>
<body>
<div id="container">
    <h1>Context Menu/Loop/Stop</h1>
    <p><a href="index.html">Back to Main</a></p>

    <h2>Video Player</h2>
    <div class="media-wrapper">
        <video id="player1" width="750" height="421" controls preload="none">
            <source src="https://commondatastorage.googleapis.com/gtv-videos-bucket/CastVideos/mp4/BigBuckBunny.mp4" type="video/mp4">
        </video>
    </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mediaelement/4.2.6/mediaelement-and-player.min.js"></script>
<script>
	var mediaElements = document.querySelectorAll('video, audio');

	for (var i = 0, total = mediaElements.length; i < total; i++) {

		var features = ['playpause','volume','progress','current','duration','fullscreen'];

		new MediaElementPlayer(mediaElements[i], {
			autoRewind: false,
			features: features,
			videoVolume: 'horizontal',
		});
	}
</script>
</body>
</html>
